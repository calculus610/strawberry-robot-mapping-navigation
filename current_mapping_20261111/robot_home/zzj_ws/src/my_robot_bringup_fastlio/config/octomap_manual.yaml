# Manual mapping only: inputs are filtered in the robot base frame because
# filter_ground_plane is enabled. Keep this enabled to preserve height semantics.
/**:
  ros__parameters:
    frame_id: map
    base_frame_id: fastlio_base_footprint
    resolution: 0.05
    point_cloud_min_z: -0.15
    point_cloud_max_z: 1.2
    filter_ground_plane: true
    ground_filter.distance: 0.04
    ground_filter.angle: 0.15
    ground_filter.plane_distance: 0.12
    # Do not re-clip occupied voxels using a different, global Z reference.
    occupancy_min_z: -100.0
    occupancy_max_z: 100.0
    sensor_model.max_range: 20.0
    sensor_model.hit: 0.7
    sensor_model.miss: 0.4
    sensor_model.min: 0.12
    sensor_model.max: 0.97
    filter_speckles: false
    compress_map: true
    incremental_2D_projection: false
    # Transient-local output is required by RViz and map_autosaver subscriptions.
    latch: true
    publish_free_space: false
