# 自主建图专用 FAST-LIO2 + Livox MID360 参数。
# 手动建图继续使用 mid360_fastlio.yaml；本文件仅将近场盲区缩小到 0.20 m，
# 防止障碍物接近车体时提前从自主导航的 /scan 中消失。
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic: "/livox/lidar"
            imu_topic: "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1
            scan_line: 4
            blind: 0.2
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 100.0
            extrinsic_est_en: true
            extrinsic_T: [-0.011, -0.02329, 0.04412]
            extrinsic_R: [1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            # 自主探索只使用 FAST-LIO 内部状态、里程计和 slam_toolbox 二维图。
            # 旧的 /Laser_map 定时器每秒追加并重新序列化整份三维点云，运行
            # 越久负载越高，最终会拖慢 TF 和避障扫描。三维累计图仅在
            # mid360_fastlio.yaml 手动建图模式保留。
            map_en: false
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            # /map_autosaver/save_now 保存自主探索所需的二维地图；三维 PCD
            # 仍由手动建图模式负责，避免为未启用的累计点云保留错误语义。
            pcd_save_en: false
            interval: -1
