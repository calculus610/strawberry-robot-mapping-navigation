slam_toolbox:
  ros__parameters:
    use_sim_time: false

    map_frame: map
    odom_frame: camera_init
    base_frame: fastlio_base_footprint
    scan_topic: /scan

    mode: mapping
    debug_logging: false
    throttle_scans: 2
    # online_async 模式只保留最新待处理扫描，避免偶发 TF 延迟后处理陈旧数据。
    scan_queue_size: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 20.0
    # slam_toolbox 的有效参数名是 min_laser_range；旧的
    # minimum_laser_range 会被忽略并回退到 0.0。
    min_laser_range: 0.5
    minimum_time_interval: 0.2
    # 将 map->camera_init 适度向未来标记，供 Nav2/explore_lite 稳定查询。
    transform_timeout: 2.0
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # FAST-LIO 已经从同一份 MID360 点云和 IMU 给出尺度准确的三维里程计。
    # 长直走廊的二维轮廓沿前进方向近似重复，二次 scan matching 会把
    # 相邻节点错误地拉近，实测使二维地图长度约缩短为三维地图的一半。
    # 因此二维栅格图直接服从 camera_init 里程计，不再重复修正位姿。
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 10.0

    # 以下阈值保留，供以后有记录包时重新评估二维 scan matching 使用。
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # 当前二维地图的职责是把 FAST-LIO 轨迹栅格化。此前关闭回环后房间
    # 重叠消失，因此尺度基准测试和日常建图均先禁用二维回环，防止相似
    # 走廊/房间产生错误约束。三维 FAST-LIO 本身不受此开关影响。
    do_loop_closing: false
    loop_search_maximum_distance: 2.0
    loop_match_minimum_chain_size: 20
    loop_match_maximum_variance_coarse: 0.5
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.70

    # 当前 FAST-LIO 里程计漂移较小时缩小回环配准搜索网格；默认 8 m
    # 对相邻相似房间过宽，容易产生错误关联。
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # 匹配失败时不继续扩大角度搜索，避免吸附到进入方向不同的相似房间。
    use_response_expansion: false

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
