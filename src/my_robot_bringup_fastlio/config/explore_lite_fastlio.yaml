/**:
  ros__parameters:
    robot_base_frame: fastlio_base_footprint
    return_to_init: false
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    visualize: true
    planner_frequency: 0.5
    progress_timeout: 25.0
    potential_scale: 8.0
    orientation_scale: 0.0
    gain_scale: 0.8
    # 查询稍早时刻的机器人位姿，避免 map->camera_init 处理延迟造成未来外推。
    transform_tolerance: 2.0
    min_frontier_size: 1.0
